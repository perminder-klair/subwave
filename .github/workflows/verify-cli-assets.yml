name: Verify CLI assets

# Catches stale cli/src/assets.generated.ts and cli/src/providers.generated.ts.
# If a contributor edits one of the source compose files or the provider
# catalogue but forgets to run `npm --prefix cli run embed-assets`, the
# committed copy drifts and `subwave init` materialises the wrong content (or
# `subwave setup` offers the wrong providers) until the next tag push. This
# workflow regenerates both files in CI and diffs them against the committed
# versions. Pure check — never writes back.

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.byo.yml"
      - "docker-compose.dev.yml"
      - ".env.example"
      - "controller/src/schemas/providers.ts"
      - "cli/src/assets.generated.ts"
      - "cli/src/providers.generated.ts"
      - "cli/scripts/embed-assets.ts"
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker-compose.byo.yml"
      - "docker-compose.dev.yml"
      - ".env.example"
      - "controller/src/schemas/providers.ts"
      - "cli/src/assets.generated.ts"
      - "cli/src/providers.generated.ts"
      - "cli/scripts/embed-assets.ts"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install cli deps
        # cli/package-lock.json is committed, so use the reproducible `npm ci`.
        working-directory: cli
        run: npm ci --no-fund --no-audit
      - name: Regenerate embedded assets
        working-directory: cli
        run: npm run embed-assets
      - name: Diff against committed copy
        run: |
          if ! git diff --exit-code -- cli/src/assets.generated.ts cli/src/providers.generated.ts; then
            echo "::error::cli/src/assets.generated.ts or cli/src/providers.generated.ts is out of sync. Run \`npm --prefix cli run embed-assets\` locally and commit the result."
            exit 1
          fi
