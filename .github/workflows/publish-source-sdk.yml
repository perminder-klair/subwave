name: Publish source SDK

# Stages @subwave/source-sdk (router/source-sdk, built from router/src/sdk)
# to npm. The package is versioned with the plugin apiVersion, not with the
# station, so most station releases leave it alone: a tag push stages it only
# when router/source-sdk/package.json names a version npm doesn't have yet.
#
# Bump that version in the PR that changes router/src/sdk: a minor for an
# additive change (a new optional op or field), a major together with
# SOURCE_API_VERSION for a breaking one (router/scripts/source-sdk.test.ts
# holds the two together).
#
# Triggers:
#   - push of a tag like v1.2.3 (release-please, through its PAT) → stage, for
#     a maintainer to approve
#   - manual workflow_dispatch → build + `npm publish --dry-run`, from any ref.
#     Tick `stage` to stage the version instead, without cutting a release;
#     that only runs from develop or main.
#
# Stages through npm trusted publishing (OIDC), so there is no NPM_TOKEN secret
# to rotate: on npmjs.com, @subwave/source-sdk → Settings → Trusted publisher
# names this repository and this workflow file, and allows only
# `npm stage publish`. A staged version goes live once a maintainer approves it
# on npmjs.com (or with the npm CLI) through a 2FA challenge; a plain
# `npm publish` from here is refused. npm only offers the trusted-publisher
# setting for a package that already exists, so 1.0.0 was published by hand.
# Staging needs npm >= 11.15.0, hence the upgrade step below.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      stage:
        description: Stage this version for approval on npmjs.com (develop or main only)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # trusted publishing and provenance

concurrency:
  group: publish-source-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (staged publishing needs 11.15.0 or newer)
        run: npm install -g npm@^11.15.0

      - name: Install router dependencies (typescript)
        run: npm ci --no-audit --no-fund
        working-directory: router

      - name: Test the package against the router's contract
        run: npm test -- source-sdk
        working-directory: router

      - name: Decide whether this version is new
        id: version
        working-directory: router/source-sdk
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.stage
        run: npm publish --dry-run
        working-directory: router/source-sdk

      - name: Stage for approval
        if: >-
          steps.version.outputs.exists == 'false' && (
            github.event_name == 'push' ||
            (inputs.stage && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
          )
        working-directory: router/source-sdk
        env:
          PKG: ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}
        run: |
          npm stage publish --access public
          echo "::notice::Staged $PKG: approve it on npmjs.com to publish it."
