name: Publish images

# Builds and pushes the first-party SUB/WAVE images to GHCR.
#
# Triggers:
#   - push of a tag like v1.2.3 → versioned release (each image's primary
#                                   build is also tagged :latest)
#   - manual workflow_dispatch    → ad-hoc rebuild from the chosen ref
#
# Images:
#   ghcr.io/<owner>/subwave-caddy       (bakes docker/Caddyfile)
#   ghcr.io/<owner>/subwave-broadcast   (icecast2 + liquidsoap + radio.liq + sounds/)
#   ghcr.io/<owner>/subwave-controller
#   ghcr.io/<owner>/subwave-web
#   ghcr.io/<owner>/subwave-aio         (whole stack in one container — the Unraid
#                                        Community Applications one-click image)
#   ghcr.io/<owner>/subwave-tts-heavy   (optional Chatterbox + PocketTTS sidecar, ~3-4GB)
#
# Platforms: the core four images (caddy, broadcast, controller, web) are
# multi-arch (linux/amd64 + linux/arm64) so Apple Silicon and ARM servers run
# natively instead of under emulation. Dockerfile.controller selects the
# matching Piper build via $TARGETARCH; Kokoro/onnx have arm64 wheels. The
# optional tts-heavy sidecar stays amd64-only — its heavy PyTorch stack makes
# an arm64 cross-build slow/large, and it's opt-in (runs fine under emulation).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Stagger the pushes. A release pushes three tags per image to ghcr.io,
      # except subwave-aio-cuda, whose two builds push 15 between them (their
      # build, version and GPU-architecture names on top). When several finish
      # their layer uploads in the same window GHCR answers the
      # manifest PUT with a 403 "secondary rate limit" (hit on the v1.7.0 run —
      # subwave-analyzer-heavy failed at `exporting to image` after the layers
      # were already up, and a re-run of that job alone passed unchanged). The
      # builds have very different durations, so capping concurrency spreads the
      # completions out. Costs wall-clock on a release run; tag pushes are rare.
      max-parallel: 4
      # publish-cli.yml's `wait-for-images` job holds the CLI release until the
      # images the CLI's compose files reference are on GHCR at this version.
      # Adding or renaming one of those images here means updating its IMAGES
      # list too (the aio images are deliberately not waited on).
      #
      # An image built by more than one entry (today only subwave-aio-cuda)
      # names each build with `cuda_family`. Every such entry
      # sets `primary`, and exactly one is `true`; that one alone takes the
      # image's plain tags (:latest, :<version>, :<major>.<minor>, sha-). An
      # entry without `cuda_family` is its image's only build, so it is
      # primary. `arch_tags` lists the GPU shortcuts a build owns, each on
      # exactly one entry: the newest build that still supports that GPU (the
      # tag table in docs/internals/infrastructure.md).
      # A job sees only its own entry, so the tagplan step checks only that
      # entry's shape. The rules across entries (one primary per image, each
      # build or architecture tag on one entry) are lint.yml's
      # `check:publish-matrix` step (controller/scripts/check-publish-matrix.ts).
      matrix:
        include:
          - image: subwave-caddy
            dockerfile: docker/Dockerfile.caddy
            platforms: linux/amd64,linux/arm64
          - image: subwave-broadcast
            dockerfile: docker/Dockerfile.broadcast
            platforms: linux/amd64,linux/arm64
          - image: subwave-controller
            dockerfile: docker/Dockerfile.controller
            platforms: linux/amd64,linux/arm64
          - image: subwave-web
            dockerfile: web/Dockerfile
            platforms: linux/amd64,linux/arm64
          # The Unraid one-click image: the whole stack (icecast2 + liquidsoap,
          # controller, web, Caddy) in one container, supervised by
          # docker/aio/supervisor.sh. amd64-only (x86-64 — every Unraid box, the
          # target for this image). arm64 is deliberately NOT built here: the
          # bundled Next.js webbuild fails its arm64 cross-build under QEMU
          # because lightningcss (Tailwind) can't load its native
          # `lightningcss.linux-arm64-gnu.node` binary in the emulated stage.
          # Native-arm64 users can still run the split-stack images, which stay
          # multi-arch. Revisit if the lightningcss/QEMU issue is resolved.
          - image: subwave-aio
            dockerfile: docker/Dockerfile.aio
            platforms: linux/amd64
            # Lean by default: the bundled analyzer is librosa-only
            # (bpm/key/intro/loudness), no torch. The subwave-aio-heavy entry
            # below bakes CLAP + Demucs for operators who want "sounds-like".
            build_args: |
              WITH_CLAP=0
              WITH_DEMUCS=0
          # Heavy AIO — same one-click container with the CLAP "sounds-like" +
          # Demucs vocal stack baked in (~1.5GB torch each). Unraid one-click
          # users who want those dimensions repoint their container at the
          # `-heavy` tag; everyone else uses the lean subwave-aio above.
          - image: subwave-aio-heavy
            dockerfile: docker/Dockerfile.aio
            platforms: linux/amd64
            build_args: |
              WITH_CLAP=1
              WITH_DEMUCS=1
          # CUDA AIO — the heavy one-click container with CLAP + Demucs on CUDA
          # torch wheels, for a box with an NVIDIA card (#1186). The AIO analog of
          # subwave-analyzer-cuda; the operator points the container at one of
          # its tags and adds GPU passthrough to its extra parameters
          # (docs/unraid.md). ~4GB compressed vs -heavy's ~1.3GB, hence its own
          # image rather than a default. Needs the disk reclaim below (see
          # `big_build`). Two builds, one per torch wheel: cu128 is primary and
          # owns :latest.
          - image: subwave-aio-cuda
            dockerfile: docker/Dockerfile.aio
            platforms: linux/amd64
            big_build: true
            cuda_family: cu128
            primary: true
            arch_tags: turing ampere ada hopper blackwell
            build_args: |
              WITH_CLAP=1
              WITH_DEMUCS=1
              WITH_CUDA=1
              TORCH_CUDA=cu128
          # torch 2.6.0+cu124 still ships SASS for sm_50, sm_60 and sm_70, which
          # cu128 dropped: the build for Maxwell, Pascal and Volta cards.
          - image: subwave-aio-cuda
            dockerfile: docker/Dockerfile.aio
            platforms: linux/amd64
            big_build: true
            cuda_family: cu124
            primary: false
            arch_tags: maxwell pascal volta
            build_args: |
              WITH_CLAP=1
              WITH_DEMUCS=1
              WITH_CUDA=1
              TORCH_CUDA=cu124
          - image: subwave-tts-heavy
            dockerfile: docker/Dockerfile.tts-heavy
            platforms: linux/amd64
            # TTS-only (Chatterbox + PocketTTS). Acoustic analysis (librosa +
            # CLAP + Demucs) was moved out into the standalone subwave-analyzer
            # image, so no analyzer build args here anymore.
          # The default-on acoustic-analysis sidecar. LEAN + MULTI-ARCH: librosa
          # only (bpm/key/intro/loudness), no torch — small enough to ship on by
          # default and run natively on arm64 (NAS/Pi/Apple-Silicon). CLAP
          # "sounds-like" + Demucs vocals are the heavy opt-in below.
          - image: subwave-analyzer
            dockerfile: docker/Dockerfile.analyzer
            platforms: linux/amd64,linux/arm64
            build_args: |
              WITH_CLAP=0
              WITH_DEMUCS=0
          # Heavy analyzer — same image with the CLAP + Demucs CPU-torch stack
          # baked in (~1.9GB). amd64-only (matching tts-heavy — the heavy PyTorch
          # stack). Operators opt in with ANALYZER_HEAVY=1 in .env, which points
          # the compose `analyzer` service at this `-heavy` image. Lazy-loaded
          # weights at runtime, disk cost only.
          - image: subwave-analyzer-heavy
            dockerfile: docker/Dockerfile.analyzer
            platforms: linux/amd64
            build_args: |
              WITH_CLAP=1
              WITH_DEMUCS=1
          # CUDA analyzer — the heavy stack on cu128 torch wheels for NVIDIA
          # hosts (#1099). amd64-only like heavy. Selected by the
          # docker-compose.analyzer-gpu.yml overlay (which also adds the GPU
          # device reservation), not by an .env var. onnxruntime stays the CPU
          # build — only the transformers CLAP path and Demucs run on the GPU.
          - image: subwave-analyzer-cuda
            dockerfile: docker/Dockerfile.analyzer
            platforms: linux/amd64
            build_args: |
              WITH_CLAP=1
              WITH_DEMUCS=1
              WITH_CUDA=1
    steps:
      # fetch-depth: 0 pulls full history + tags so `git describe` resolves the
      # version on a workflow_dispatch from a branch (a tag push already has the
      # tag at HEAD).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reclaim runner disk before the biggest builds. A GitHub-hosted
      # ubuntu-latest has ~14GB free on the root filesystem, which is where
      # /var/lib/docker lives — and subwave-aio-cuda is ~4GB compressed / ~11GB
      # unpacked (the cu128 nvidia-*-cu12 wheels), enough to hit ENOSPC mid-build
      # once the buildx layer cache is added on top. These toolchains ship
      # preinstalled on the runner image and nothing in this workflow uses them;
      # dropping them frees ~20GB. Gated on the matrix flag so the small builds
      # don't pay the ~30s for nothing.
      - name: Free runner disk space
        if: matrix.big_build
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift
          df -h /

      # The version stamped into the images (admin footer + controller). On a tag
      # push `git describe` returns the tag (e.g. v0.31.0); a branch dispatch
      # yields <tag>-<n>-g<sha>. Empty → builds fall back to package.json.
      - id: version
        run: echo "version=$(git describe --tags --always 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      # QEMU provides the cross-arch emulation buildx needs to build the
      # linux/arm64 variant on the amd64 GitHub runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Which tags this build may take, worked out once so the rules below stay
      # plain (the matrix keys are described above the matrix). This step sees
      # only its own entry, so it checks only that entry's shape: a cuda_family
      # build must say primary: true or false, and arch_tags needs a
      # cuda_family. One primary per image and one owner per tag are checked
      # across the matrix by lint.yml.
      #   primary     owns the image's plain tags.
      #   sha_prefix  a non-primary build's commit tag carries its family, so
      #               two builds can't overwrite one sha- tag.
      #   floating    the build and GPU-architecture shortcuts (:cu124, :pascal,
      #               …) as tag rules. They move on a stable release or a
      #               dispatch from the default branch, never on a prerelease
      #               (a tag with a `-`) or another branch.
      - id: tagplan
        env:
          CUDA_FAMILY: ${{ matrix.cuda_family }}
          PRIMARY: ${{ matrix.primary }}
          ARCH_TAGS: ${{ matrix.arch_tags }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          primary=true
          if [ -n "$CUDA_FAMILY" ]; then
            case "$PRIMARY" in
              true | false) primary=$PRIMARY ;;
              *) echo "::error::the $CUDA_FAMILY build must set primary: true or false"; exit 1 ;;
            esac
          elif [ -n "$ARCH_TAGS" ]; then
            echo "::error::arch_tags needs a cuda_family"; exit 1
          fi
          sha_prefix=sha-
          if [ "$primary" = false ]; then sha_prefix="sha-$CUDA_FAMILY-"; fi
          moves=false
          case "$EVENT_NAME:$REF_NAME" in
            push:*-*) ;;
            push:*) moves=true ;;
          esac
          if [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then moves=true; fi
          floating=
          if [ -n "$CUDA_FAMILY" ] && [ "$moves" = true ]; then
            floating=$(for tag in "$CUDA_FAMILY" $ARCH_TAGS; do printf 'type=raw,value=%s\n' "$tag"; done)
          fi
          {
            echo "primary=$primary"
            echo "sha_prefix=$sha_prefix"
            echo "floating<<FLOATING_TAGS"
            if [ -n "$floating" ]; then echo "$floating"; fi
            echo "FLOATING_TAGS"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # metadata-action adds :latest by itself for any enabled stable
          # type=semver rule (latest=auto), whatever that rule's own suffix, so
          # a non-primary build turns auto off or it races the primary for
          # :latest on every release.
          flavor: |
            latest=${{ steps.tagplan.outputs.primary == 'true' && 'auto' || 'false' }}
          tags: |
            # The primary build owns the image's plain tags.
            type=raw,value=latest,enable=${{ steps.tagplan.outputs.primary == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}},enable=${{ steps.tagplan.outputs.primary }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.tagplan.outputs.primary }}
            # Only on an ad-hoc dispatch, where the ref is a branch and nothing
            # else pins the commit. A tag push already has {{version}} pointing
            # at exactly one commit, so the sha tag is a redundant extra
            # manifest push per image.
            type=sha,prefix=${{ steps.tagplan.outputs.sha_prefix }},format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
            # Each CUDA build also pins every release under its own name
            # (:1.2.3-cu124), prereleases included.
            type=semver,pattern={{version}},suffix=-${{ matrix.cuda_family }},enable=${{ matrix.cuda_family && 'true' || 'false' }}
            # The build and architecture shortcuts, when this run moves them.
            ${{ steps.tagplan.outputs.floating }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            ${{ matrix.build_args }}
            SUBWAVE_BUILD_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          # mode=max caches every intermediate layer, which is right for the
          # small images. The cuda build exports NO cache at all: even mode=min
          # exports the final image's layers, and its multi-GB torch venv layer
          # sits in the final stage — one entry would evict most other scopes
          # from the 10GB repo-wide GHA cache budget. Tag builds are rare, so a
          # cold rebuild is the cheaper trade. (cache-from above stays — it's a
          # harmless miss while nothing is ever exported to that scope.)
          cache-to: ${{ !matrix.big_build && format('type=gha,scope={0},mode=max', matrix.image) || '' }}
