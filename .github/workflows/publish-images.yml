name: Publish images

# Builds and pushes the first-party SUB/WAVE images to GHCR.
#
# Triggers:
#   - push of a tag like v1.2.3 → versioned release (also tagged :latest)
#   - manual workflow_dispatch    → ad-hoc rebuild from the chosen ref
#
# Images:
#   ghcr.io/<owner>/subwave-caddy       (bakes docker/Caddyfile)
#   ghcr.io/<owner>/subwave-broadcast   (icecast2 + liquidsoap + radio.liq + sounds/)
#   ghcr.io/<owner>/subwave-controller
#   ghcr.io/<owner>/subwave-web
#   ghcr.io/<owner>/subwave-router      (music router: Jellyfin/Plex/plugin sources, #692)
#   ghcr.io/<owner>/subwave-aio         (whole stack in one container — the Unraid
#                                        Community Applications one-click image)
#   ghcr.io/<owner>/subwave-tts-heavy   (optional Chatterbox + PocketTTS sidecar, ~3-4GB)
#
# Platforms: the core four images (caddy, broadcast, controller, web) are
# multi-arch (linux/amd64 + linux/arm64) so Apple Silicon and ARM servers run
# natively instead of under emulation. Dockerfile.controller selects the
# matching Piper build via $TARGETARCH; Kokoro/onnx have arm64 wheels. The
# optional tts-heavy sidecar stays amd64-only — its heavy PyTorch stack makes
# an arm64 cross-build slow/large, and it's opt-in (runs fine under emulation).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Stagger the pushes. All 11 images push 4 tags each to ghcr.io, and when
      # several finish their layer uploads in the same window GHCR answers the
      # manifest PUT with a 403 "secondary rate limit" (hit on the v1.7.0 run —
      # subwave-analyzer-heavy failed at `exporting to image` after the layers
      # were already up, and a re-run of that job alone passed unchanged). The
      # builds have very different durations, so capping concurrency spreads the
      # completions out. Costs wall-clock on a release run; tag pushes are rare.
      max-parallel: 4
      matrix:
        include:
          - image: subwave-caddy
            dockerfile: docker/Dockerfile.caddy
            platforms: linux/amd64,linux/arm64
          - image: subwave-broadcast
            dockerfile: docker/Dockerfile.broadcast
            platforms: linux/amd64,linux/arm64
          - image: subwave-controller
            dockerfile: docker/Dockerfile.controller
            platforms: linux/amd64,linux/arm64
          - image: subwave-web
            dockerfile: web/Dockerfile
            platforms: linux/amd64,linux/arm64
          # Music router (#692). Pure Node, so multi-arch like the core four.
          - image: subwave-router
            dockerfile: docker/Dockerfile.router
            platforms: linux/amd64,linux/arm64
          # The Unraid one-click image: the whole stack (icecast2 + liquidsoap,
          # controller, web, Caddy) in one container, supervised by
          # docker/aio/supervisor.sh. amd64-only (x86-64 — every Unraid box, the
          # target for this image). arm64 is deliberately NOT built here: the
          # bundled Next.js webbuild fails its arm64 cross-build under QEMU
          # because lightningcss (Tailwind) can't load its native
          # `lightningcss.linux-arm64-gnu.node` binary in the emulated stage.
          # Native-arm64 users can still run the split-stack images, which stay
          # multi-arch. Revisit if the lightningcss/QEMU issue is resolved.
          - image: subwave-aio
            dockerfile: docker/Dockerfile.aio
            platforms: linux/amd64
            # Lean by default: the bundled analyzer is librosa-only
            # (bpm/key/intro/loudness), no torch. The subwave-aio-heavy entry
            # below bakes CLAP + Demucs for operators who want "sounds-like".
            build_args: |
              WITH_CLAP=0
              WITH_DEMUCS=0
          # Heavy AIO — same one-click container with the CLAP "sounds-like" +
          # Demucs vocal stack baked in (~1.5GB torch each). Unraid one-click
          # users who want those dimensions repoint their container at the
          # `-heavy` tag; everyone else uses the lean subwave-aio above.
          - image: subwave-aio-heavy
            dockerfile: docker/Dockerfile.aio
            platforms: linux/amd64
            build_args: |
              WITH_CLAP=1
              WITH_DEMUCS=1
          # CUDA AIO — the heavy one-click container with CLAP + Demucs on cu124
          # torch wheels, for a box with an NVIDIA card (#1186). The AIO analog of
          # subwave-analyzer-cuda; the operator points the container at this tag
          # and adds GPU passthrough to its extra parameters (docs/unraid.md).
          # ~4GB compressed vs -heavy's ~1.3GB, hence its own tag rather than a
          # default. Needs the disk reclaim below (see `big_build`).
          - image: subwave-aio-cuda
            dockerfile: docker/Dockerfile.aio
            platforms: linux/amd64
            big_build: true
            build_args: |
              WITH_CLAP=1
              WITH_DEMUCS=1
              WITH_CUDA=1
          - image: subwave-tts-heavy
            dockerfile: docker/Dockerfile.tts-heavy
            platforms: linux/amd64
            # TTS-only (Chatterbox + PocketTTS). Acoustic analysis (librosa +
            # CLAP + Demucs) was moved out into the standalone subwave-analyzer
            # image, so no analyzer build args here anymore.
          # The default-on acoustic-analysis sidecar. LEAN + MULTI-ARCH: librosa
          # only (bpm/key/intro/loudness), no torch — small enough to ship on by
          # default and run natively on arm64 (NAS/Pi/Apple-Silicon). CLAP
          # "sounds-like" + Demucs vocals are the heavy opt-in below.
          - image: subwave-analyzer
            dockerfile: docker/Dockerfile.analyzer
            platforms: linux/amd64,linux/arm64
            build_args: |
              WITH_CLAP=0
              WITH_DEMUCS=0
          # Heavy analyzer — same image with the CLAP + Demucs CPU-torch stack
          # baked in (~1.9GB). amd64-only (matching tts-heavy — the heavy PyTorch
          # stack). Operators opt in with ANALYZER_HEAVY=1 in .env, which points
          # the compose `analyzer` service at this `-heavy` image. Lazy-loaded
          # weights at runtime, disk cost only.
          - image: subwave-analyzer-heavy
            dockerfile: docker/Dockerfile.analyzer
            platforms: linux/amd64
            build_args: |
              WITH_CLAP=1
              WITH_DEMUCS=1
          # CUDA analyzer — the heavy stack on cu124 torch wheels for NVIDIA
          # hosts (#1099). amd64-only like heavy. Selected by the
          # docker-compose.analyzer-gpu.yml overlay (which also adds the GPU
          # device reservation), not by an .env var. onnxruntime stays the CPU
          # build — only the transformers CLAP path and Demucs run on the GPU.
          - image: subwave-analyzer-cuda
            dockerfile: docker/Dockerfile.analyzer
            platforms: linux/amd64
            build_args: |
              WITH_CLAP=1
              WITH_DEMUCS=1
              WITH_CUDA=1
    steps:
      # fetch-depth: 0 pulls full history + tags so `git describe` resolves the
      # version on a workflow_dispatch from a branch (a tag push already has the
      # tag at HEAD).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reclaim runner disk before the biggest builds. A GitHub-hosted
      # ubuntu-latest has ~14GB free on the root filesystem, which is where
      # /var/lib/docker lives — and subwave-aio-cuda is ~4GB compressed / ~11GB
      # unpacked (the cu124 nvidia-*-cu12 wheels), enough to hit ENOSPC mid-build
      # once the buildx layer cache is added on top. These toolchains ship
      # preinstalled on the runner image and nothing in this workflow uses them;
      # dropping them frees ~20GB. Gated on the matrix flag so the small builds
      # don't pay the ~30s for nothing.
      - name: Free runner disk space
        if: matrix.big_build
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift
          df -h /

      # The version stamped into the images (admin footer + controller). On a tag
      # push `git describe` returns the tag (e.g. v0.31.0); a branch dispatch
      # yields <tag>-<n>-g<sha>. Empty → builds fall back to package.json.
      - id: version
        run: echo "version=$(git describe --tags --always 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      # QEMU provides the cross-arch emulation buildx needs to build the
      # linux/arm64 variant on the amd64 GitHub runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Only on an ad-hoc dispatch, where the ref is a branch and nothing
            # else pins the commit. A tag push already has {{version}} pointing
            # at exactly one commit, so the sha tag is a redundant fourth
            # manifest push per image (11 of the 44 a release run makes).
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            ${{ matrix.build_args }}
            SUBWAVE_BUILD_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          # mode=max caches every intermediate layer, which is right for the
          # small images. The cuda build exports NO cache at all: even mode=min
          # exports the final image's layers, and its multi-GB torch venv layer
          # sits in the final stage — one entry would evict most other scopes
          # from the 10GB repo-wide GHA cache budget. Tag builds are rare, so a
          # cold rebuild is the cheaper trade. (cache-from above stays — it's a
          # harmless miss while nothing is ever exported to that scope.)
          cache-to: ${{ !matrix.big_build && format('type=gha,scope={0},mode=max', matrix.image) || '' }}
