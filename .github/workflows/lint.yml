name: Lint

# Runs ESLint + tsc --noEmit on every PR and on pushes to main/develop.
# controller/ and web/ expose `npm run lint` (`eslint . && tsc --noEmit`);
# mcp-subwave/ exposes `npm run lint` (`tsc --noEmit`). This just enforces them.
#
# The two packages run in a matrix so a controller failure doesn't mask a
# web failure (and vice versa). Branch protection on main/develop should
# require both jobs.
#
# Security note: no untrusted user input (PR title/body/commit message)
# flows into any `run:` step. Only workflow-defined matrix values and
# built-in github context fields are interpolated.

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [controller, web, mcp-subwave]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci --no-audit --no-fund

      # Controller tests import web helpers (including dashboard types), so
      # checking them also needs the dependencies declared by the web package.
      - name: Install web deps (controller test cross-package imports)
        if: matrix.package == 'controller'
        working-directory: web
        run: npm ci --no-audit --no-fund

      # mcp-subwave is a thin launcher that imports the shared MCP sources from
      # controller/src/mcp/**, so its `tsc --noEmit` type-checks those files —
      # which resolve @modelcontextprotocol/sdk + zod from controller/node_modules.
      # Install the controller's deps too, or the type-check can't find them.
      - name: Install controller deps (mcp-subwave cross-package import)
        if: matrix.package == 'mcp-subwave'
        working-directory: controller
        run: npm ci --no-audit --no-fund

      # The web theme-token mirror (web/lib/theme-tokens.generated.ts) is
      # generated from the controller registry. Regenerate and fail on any
      # drift, so a token change can't ship without regenerating the mirror.
      - name: Verify theme-token mirror is up to date
        if: matrix.package == 'controller'
        run: |
          npm run gen:themes
          git diff --exit-code ../web/lib/theme-tokens.generated.ts

      # The web schema mirror (web/lib/schemas.generated.ts) is generated from
      # controller/src/schemas/**. Regenerate and fail on any drift, so a schema
      # change can't ship without regenerating the mirror the forms validate on.
      - name: Verify schema mirror is up to date
        if: matrix.package == 'controller'
        run: |
          npm run gen:schemas
          git diff --exit-code ../web/lib/schemas.generated.ts

      # The drift check above only proves the two sides run the same schema
      # TEXT. If the packages resolve different zod builds, the schema the form
      # runs and the schema the route runs can still disagree — the one property
      # the mirror exists to guarantee. A lone `npm update zod` in either
      # package is all it takes, so pin the declared ranges to each other.
      - name: Verify controller and web declare the same zod version
        if: matrix.package == 'controller'
        run: |
          node -e '
            const c = require("./package.json").dependencies.zod;
            const w = require("../web/package.json").dependencies.zod;
            // Both sides reading `dependencies.zod` means a zod that moved to
            // devDependencies in both packages would compare undefined ===
            // undefined and pass vacuously — the check would go green having
            // compared nothing. Demand a declared range before comparing.
            for (const [pkg, range] of [["controller", c], ["web", w]]) {
              if (!range) {
                console.error(`${pkg} does not declare zod in dependencies. The schema mirror is shared runtime code, so both packages must declare zod as a runtime dependency.`);
                process.exit(1);
              }
            }
            if (c !== w) {
              console.error(`zod version mismatch: controller ${c} vs web ${w}. The schema mirror is copied text, so both packages must declare the same zod range — update both together.`);
              process.exit(1);
            }
            console.log(`zod ${c} on both sides`);
          '

      - run: npm run lint
